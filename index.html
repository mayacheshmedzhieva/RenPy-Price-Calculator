<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Ren'Py Calculator</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .container {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    input,
    select,
    button {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    button {
      background: #c3567a;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>Ren'Py Project Cost Estimator</h3>

    <label>Word Count:</label>
    <input type="number" id="words" value="5000">

    <label>Complexity:</label>
    <select id="complexity">
      <option value="0.004">Simple</option>
      <option value="0.006">Medium</option>
      <option value="0.009">Advanced</option>
    </select>

    <label><input type="checkbox" id="ui"> Custom UI (+$200)</label>
    <label><input type="checkbox" id="systems"> Systems (+$500)</label>

    <button onclick="calculateCost()">Estimate Cost</button>

    <p id="result"></p>
  </div>

  <script>
    function calculateCost() {
      var words = document.getElementById("words").value;
      var complexity = document.getElementById("complexity").value;

      var cost = words * complexity;

      if (document.getElementById("ui").checked) cost += 200;
      if (document.getElementById("systems").checked) cost += 500;

      var min = Math.round(cost * 0.8);
      var max = Math.round(cost * 1.2);

      document.getElementById("result").innerHTML =
        "Estimated Cost: $" + min + " - $" + max;
    }
  </script>

</body>

</html>
