<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Ren'Py Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'ANONYMOUS PRO';
    }

    body {
      margin: 0;
      background: transparent;
      font-family: 'ANONYMOUS PRO';
    }

    .container {
      background: transparent;
      font-weight: bold;
      color: white;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .div-row {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      column-gap: 3em;
      row-gap: 0.5em;
      align-items: center;
    }

    .div-row>div {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    input,
    select,
    button {
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 5px;
      border: none;

    }

    input,
    select,
    select>* {
      width: 100%;
      color: #520026;
      background: #ffffffa8;
      box-sizing: border-box;
      font-family: 'ANONYMOUS PRO';
      font-weight: bold;
    }

    button {
      width: auto;
      background: #520026;
      ;
      color: white;
      font-family: 'ANONYMOUS PRO';
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="div-row">
      <div>
        <label>Word Count:</label>
        <input type="number" id="words" value="5000">
      </div>
      <div>
        <label>Branching Density:</label>
        <select id="branching">
          <option value="1">Very Low (0-1 choices / 1000 words)</option>
          <option value="2">Low (2-3 choices / 1000 words)</option>
          <option value="3">Moderate (4-6 choices / 1000 words)</option>
          <option value="4">High (7-10 choices / 1000 words)</option>
          <option value="5">Very High (10+ choices / 1000 words)</option>
        </select>
      </div>
      <div>
        <label>Choices Conditions:</label>
        <select id="conditional">
          <option value="1">Simple (few flags)</option>
          <option value="2">Moderate (multiple variables)</option>
          <option value="3">Advanced (systems, heavy logic)</option>
        </select>
      </div>
      <div>
        <label>Endings:</label>
        <select id="endings">
          <option value="1">1 (linear story)</option>
          <option value="2">2-3 (few alternate endings)</option>
          <option value="3">4-6 (multiple routes/endings)</option>
          <option value="4">7+ (many branching outcomes)</option>
        </select>
      </div>
    </div>
    <div class="div-row">
      <div>
        <label>UI Complexity:</label>
        <select id="ui_complexity">
          <option value="0">Default (standard Ren'Py UI)</option>
          <option value="1">Light (small changes, colors, layout tweaks)</option>
          <option value="2">Custom Screens (new menus, modified UI)</option>
          <option value="3">Fully Custom (unique UI, heavily redesigned)</option>
        </select>
      </div>
      <div>
        <label>Visual Effects:</label>
        <select id="effects">
          <option value="1">Basic (fades, transitions)</option>
          <option value="2">Custom (animated effects, shaders)</option>
          <option value="3">Advanced (complex animated systems)</option>
        </select>
      </div>
      <div>
        <label>Asset Content:</label>
        <select id="assets">
          <option value="1">Low (1-2 characters, few backgrounds)</option>
          <option value="2">Medium (several characters, multiple scenes)</option>
          <option value="3">High (many characters, CGs, variations)</option>
        </select>
      </div>
      <div>
        <label>Minigames:</label>
        <select id="minigames">
          <option value="0">None</option>
          <option value="1">1 (simple interaction)</option>
          <option value="2">2-3 (multiple small minigames)</option>
          <option value="3">4+ (many or complex minigames)</option>
        </select>
      </div>
    </div>
    <div class="div-row">
      <span id="result"></span>
      <button onclick="calculateCost()">Estimate Cost</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      function calculateCost() {
        // Get input values
        var words = parseFloat(jQuery("#words").val());
        var branching = parseInt(jQuery("#branching").val());
        var conditional = parseInt(jQuery("#conditional").val());
        var endings = parseInt(jQuery("#endings").val());
        var ui = parseInt(jQuery("#ui_complexity").val());
        var effects = parseInt(jQuery("#effects").val());
        var assets = parseInt(jQuery("#assets").val());
        var minigames = parseInt(jQuery("#minigames").val());
        // Base rate
        var base_rate = 0.006;
        // Multipliers (complexity)
        var branching_mult = [0.8, 1, 1.3, 1.7, 2.2];
        var conditional_mult = [0.9, 1.2, 1.6];
        var endings_mult = [0.85, 1.2, 1.4, 1.7];
        var assets_mult = [1, 1.15, 1.3];
        // Additive costs (features)
        var ui_cost = [0, 150, 350, 700];
        var effects_cost = [0, 100, 300, 600];
        var minigame_cost = [0, 200, 600, 1200];
        // Base cost
        var base_cost = words * base_rate;
        // Apply multipliers
        var total = base_cost
          * branching_mult[branching - 1]
          * conditional_mult[conditional - 1]
          * endings_mult[endings - 1]
          * assets_mult[assets - 1];
        // Add feature costs
        total += ui_cost[ui];
        total += effects_cost[effects];
        total += minigame_cost[minigames];
        // Safety floor (prevents underpricing)
        total = Math.max(total, base_cost * 1.2);
        // Range output
        var min = Math.round(total * 0.8);
        var max = Math.round(total * 1.2);
        // Output result
        jQuery("#result").html("Estimated Cost: $" + min + " - $" + max);
        jQuery("#result").show();
      }
    </script>

</body>

</html>
